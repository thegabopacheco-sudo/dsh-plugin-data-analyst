# dsh-plugin-data-analyst — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "data".
# Tools resultantes: mcp__data__* (ver README).
- insert:
    - id: mcp-data-analyst
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: data
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/data-analyst/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
